name: research-data
# Factor data for research (GEX/DIX, VIX term structure, FRED liquidity, FOMC calendar) -> branch research-data
on:
  workflow_dispatch: {}
  schedule:
    - cron: "53 4 * * 6"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas requests yfinance
      - run: cd research_data && python fetch.py
      - name: Push to research-data branch
        run: |
          cd research_data/out
          git init -q && git checkout -q -b research-data
          git config user.name "edge-bot"; git config user.email "edge-bot@users.noreply.github.com"
          git add -A && git commit -q -m "research data $(date -u +%F)"
          git push -f -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git research-data
