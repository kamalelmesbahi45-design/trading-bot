name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip
          # MetaTrader5 is Windows-only; the marker in pyproject keeps it skipped here.
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest -q --maxfail=5 --cov=src/xauusd_bot --cov-report=term

      - name: CLI smoke
        run: |
          python -m xauusd_bot.cli info -c configs/personal_aggressive.yaml > /dev/null
          python -m xauusd_bot.cli info -c configs/propfirm_strict.yaml > /dev/null
