name: intraday-day-trading
# Rebuilds today's day-trading plan (6 systems) and the dashboard every 30 minutes on weekdays,
# 05:00-21:59 UTC = from before the London open to after the New York close (summer and winter).
on:
  schedule:
    - cron: "7,37 5-21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: edge-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_intraday.py
      - name: Commit dashboard + day-trading data
        run: |
          git config user.name  "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add docs/index.html data/intraday.json data/daytrade_log.csv 2>/dev/null || git add docs/index.html data/intraday.json
          git commit -q -m "intraday $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q && exit 0; sleep 5; done
          exit 1
