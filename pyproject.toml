[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-bot"
version = "0.1.0"
description = "Adaptive quantitative trading bot for XAUUSD with walk-forward validation."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  # core
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "numba>=0.59",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "tenacity>=8.2",
  # data
  "requests>=2.31",
  "httpx>=0.27",
  "yfinance>=0.2.40",
  "lxml>=5.2",
  "beautifulsoup4>=4.12",
  # ml
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "lightgbm>=4.3",
  # reports
  "jinja2>=3.1",
  "plotly>=5.20",
  "matplotlib>=3.8",
  # execution
  "MetaTrader5>=5.0.45 ; sys_platform == 'win32'",
  # alerts
  "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML",
  "types-requests",
]
llm = [
  "anthropic>=0.34",
]
sentiment = [
  "transformers>=4.40",
  "torch>=2.2",
]

[project.scripts]
xauusd = "xauusd_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/xauusd_bot/cli.py" = ["B008"]  # typer requires Option() in defaults

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "xauusd_bot.cli"
disable_error_code = ["untyped-decorator", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
